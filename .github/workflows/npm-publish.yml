name: Publish to NPM

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

# npm Trusted Publishing (OIDC): yayın token'sız yapılır, id-token izni zorunludur.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Sürüm artırılmadan yapılan push'larda yayın adımı atlanır.
      - name: Check if version is already published
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-kargo-entegrator@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION zaten yayında, yayın atlanıyor."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: steps.version.outputs.published == 'false'
        run: npm publish
